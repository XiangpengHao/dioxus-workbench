[package]
name = "dioxus-workbench"
description = "A dockable panel workbench for Dioxus: tabs, splits, drag-to-dock, activity rail, and status bar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["dioxus", "docking", "panels", "workbench", "layout"]
categories = ["gui"]
readme = "../README.md"

[dependencies]
dioxus = { workspace = true }
# The layout tree is the durable artifact an application persists, so the
# serde derives are unconditional rather than an opt-in feature.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-timer = "3"
